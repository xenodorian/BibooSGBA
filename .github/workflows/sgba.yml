name: SGBA packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "sgba/**"
      - ".github/workflows/sgba.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get the SGBA engine
        run: |
          ref=$(grep -v '^#' sgba/sgba.ref | head -1)
          git clone --depth 1 --branch "$ref" https://github.com/xenodorian/SGBA .sgba-engine
      - name: Check the game runs on SGBA
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python -m pip install pygame==2.6.1 quickjs-ng==0.17.0.1
          python .sgba-engine/tools/sgba_check.py web

  package:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build Windows and ArkOS packages
        run: python sgba/build.py
      - name: Build the native (C runtime) packages
        run: |
          python -m pip install ziglang==0.17.0
          python sgba/build.py --native
      - uses: actions/upload-artifact@v4
        with:
          name: parry-perry-sgba
          path: |
            dist/*.zip
            dist/*.sgba
      # GitROMs (the R36S downloader) reads the latest release, because Actions
      # artifacts need a login. Pre-releases are ignored by releases/latest, so
      # this must stay a normal release.
      - name: Publish the game to the rolling "latest" release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Latest build" --notes "Rolling build, replaced on every publish." \
            --target "$GITHUB_SHA" --latest
          # One download path for the device: the game-only port. The standalone bundles stay as workflow artifacts.
          gh release upload latest dist/parry-perry-port.zip --clobber
